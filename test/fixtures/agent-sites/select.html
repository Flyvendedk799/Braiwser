<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Select</title>
<style>body{font:16px system-ui;margin:24px}label{display:block;margin:8px 0}</style></head>
<body>
<main>
  <h1>Select</h1>
  <label>Plan
    <select id="plan">
      <option value="free">Free</option>
      <option value="pro">Pro tier</option>
      <option value="legacy" disabled>Legacy</option>
      <optgroup label="Retired" disabled><option value="retired">Retired plan</option></optgroup>
      <option value="dup">Duplicate A</option>
      <option value="dup">Duplicate B</option>
    </select>
  </label>
  <label>Toppings
    <select id="toppings" multiple size="3">
      <option value="ham" selected>Ham</option>
      <option value="olive" selected>Olive</option>
      <option value="corn">Corn</option>
    </select>
  </label>
  <label>Locked
    <select id="locked" disabled><option value="a">A</option><option value="b">B</option></select>
  </label>
  <button id="apply" type="button">Apply</button>
  <!-- every input/change event the PAGE saw: "type:value:trusted" -->
  <div role="status" id="log">idle</div>
</main>
<script>
(function () {
  var log = document.getElementById('log');
  var seen = [];
  ['plan', 'toppings', 'locked'].forEach(function (id) {
    var el = document.getElementById(id);
    ['input', 'change'].forEach(function (type) {
      el.addEventListener(type, function (e) {
        var values = Array.prototype.slice.call(el.selectedOptions).map(function (o) { return o.value; }).join('+');
        seen.push(type + ':' + id + '=' + values + ':' + (e.isTrusted ? 'trusted' : 'script'));
        log.textContent = seen.join(' | ');
      });
    });
  });
})();
</script>
</body></html>
