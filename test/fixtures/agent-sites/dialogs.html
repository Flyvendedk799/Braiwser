<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Dialogs</title></head>
<body>
<main>
  <button id="confirm" type="button" onclick="document.getElementById('log').textContent='confirm=' + confirm('Delete everything?')">Delete account</button>
  <button id="alert" type="button" onclick="alert('Heads up'); document.getElementById('log').textContent='alert-done'">Show alert</button>
  <div role="status" id="log">idle</div>
</main>
</body></html>
